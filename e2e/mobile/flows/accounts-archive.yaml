appId: app.nestworth.ios
---
- launchApp:
    clearState: true

- runFlow: ../login.yaml

# Dismiss onboarding if present
- runFlow:
    when:
      visible: 'Skip'
    commands:
      - tapOn: 'Skip'

- assertVisible: 'Accounts'

# Purge any Maestro-prefixed accounts left over from prior runs
- runFlow: ../cleanup-test-accounts.yaml

# Create a scratch account
- tapOn:
    id: 'accounts-add-btn'
- tapOn:
    id: 'accounts-new-name'
- inputText: 'Maestro Archive Account'
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'accounts-create-btn'
- extendedWaitUntil:
    visible: '.*Maestro Archive Account.*'
    timeout: 10000

# Archive it from the edit-mode row
- tapOn:
    id: 'accounts-edit-toggle'
- tapOn:
    id: 'accounts-archive-Maestro Archive Account'

# It leaves the active list and the collapsed Archived group appears
- extendedWaitUntil:
    notVisible:
      id: 'accounts-archive-Maestro Archive Account'
    timeout: 10000
- assertVisible:
    id: 'accounts-archived-toggle'

# Expand the group: the card is back, with an Unarchive action
- tapOn:
    id: 'accounts-archived-toggle'
- extendedWaitUntil:
    visible:
      id: 'accounts-unarchive-Maestro Archive Account'
    timeout: 10000

# Unarchive restores it to the active list
- tapOn:
    id: 'accounts-unarchive-Maestro Archive Account'
- extendedWaitUntil:
    visible:
      id: 'accounts-archive-Maestro Archive Account'
    timeout: 10000

# Delete is still the destructive exit (the alert now also offers archiving)
- tapOn:
    id: 'accounts-delete-Maestro Archive Account'
- tapOn: 'Delete'

- assertNotVisible: '.*Maestro Archive Account.*'
