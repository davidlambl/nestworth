name: Tests

on:
  push:
    branches: [main]
  # Deliberately NOT filtered by branch. `pull_request: branches: [x]` matches the
  # PR's BASE, so a filter here silently gives stacked PRs (base != main) zero
  # checks — which is how the sync-engine and migration work first went unverified.
  pull_request:

# One run per pull request (#141). A new push to a PR cancels that PR's older
# run, whether it is still queued or already running. A push to main is grouped
# by its commit, so main's post-merge runs never cancel each other; their
# hosted Playwright jobs wait for one another in the playwright-e2e-user queue
# below instead. The group starts with the workflow's name because a
# concurrency group is shared by every workflow in the repository.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Unit tests
        run: npm test

  build-web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Catches breakage that unit tests can't see: a bad import, a missing
      # asset, or a route that fails to bundle. This is also exactly what
      # Netlify runs to deploy, so a red build here means a red deploy.
      #
      # The export prerenders routes, which loads lib/supabase.ts and
      # constructs the client at module scope — so it needs the EXPO_PUBLIC_*
      # values present or it fails with "supabaseUrl is required". Falls back
      # to a syntactically valid placeholder so forks without the secrets still
      # get the build check; nothing here talks to Supabase at build time.
      # The client builds with the publishable key when it is set and with the
      # legacy anon key otherwise (#191, lib/supabaseKey.ts). A secret that does
      # not exist arrives empty, which counts as unset, so until
      # EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY is stored this builds with the anon
      # key, as before.
      - name: Export web bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npx expo export -p web
      # The export succeeds even when the root HTML (app/+html.tsx) leaves out
      # the bundles it is handed (useServerDocumentContext's bodyNodes, since
      # SDK 58); every page would then load no script and never start (#51).
      - name: Check the exported page loads the app
        run: grep -q '<script[^>]*src="/_expo/static/js/web/entry-[0-9a-f]*\.js"' dist/index.html

  build-electron:
    name: Electron main compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compile-only. Packaging the .dmg needs macOS plus signing/notarization
      # credentials, so CI verifies the main-process TypeScript still builds
      # rather than producing an artifact.
      - name: Compile Electron main
        run: npm run electron:tsc

  # Every migration applied from empty to a local Supabase database on this
  # runner, then the newest applied a second time with migrate.yml's own psql
  # command (#93): the rehearsal of the file the owner will dispatch to
  # production, run before it is merged. No secrets and no environment, by
  # design, so nothing here can reach the hosted project; the local
  # database's password is the CLI's public default. The CLI is the pinned
  # devDependency `supabase`, Docker is on the runner, and `db start` brings
  # up Postgres alone with the Auth, Storage and Realtime schemas 001 and 009
  # build on (supabase/config.toml). The recipe for a local run is in
  # CONTRIBUTING.md section 3.
  migrations:
    name: Migration rehearsal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start a local database and apply every migration from empty
        run: npx supabase db start
      - name: Apply the newest migration a second time, as migrate.yml applies it
        run: npm run db:rehearse

  # Playwright against the local Supabase stack on this runner (#221, the
  # move #93 decided). The run signs in as a user it makes for itself through
  # the stack's Auth admin API (e2e/web/helpers/local-stack.ts), so the job
  # reads no secret, runs on every push and pull request, forks included,
  # waits for no other job and leaves nothing behind. The stack is
  # supabase/config.toml's less Studio and pg-meta, which no spec uses, started
  # by the pinned devDependency `supabase` on the runner's Docker; its keys are
  # the CLI's local demo keys, which the run reads from `supabase status`.
  e2e-web:
    name: Playwright (web)
    # A run takes about six minutes. The three long steps below have limits of
    # their own (#241), so a slow one fails under its own name ("The action
    # 'Install Playwright browsers' has timed out after 20 minutes.") and the
    # report upload still runs, which a job cancelled at its limit skips. This
    # backstop is their sum (45) plus five minutes for the steps with none:
    # checkout, Node, npm ci and the upload took 79 s at most together, and
    # the cache adds its restore and save.
    timeout-minutes: 50
    # `playwright install --with-deps` needs a Playwright that supports the runner's Ubuntu:
    # 1.64 supports 24.04 and 26.04; ubuntu-latest moves to 26.04 by 2026-11-19 (#197, #198).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers' system packages, cached (#241). `--with-deps` installs
      # 185 Ubuntu packages, 139 MB, from the runner's mirror, which can crawl:
      # 40 kB/s until the job's limit cancelled it on run 42115005742, and two
      # to fourteen and a half minutes on seven more runs, while the browsers
      # themselves come from Playwright's CDN in 7-12 s every time. So the
      # packages are kept per runner image and Playwright version, and apt is
      # handed only the kept files whose SHA-256 the index it has just fetched
      # lists: apt takes a file already in its archive directory on its name
      # and size alone. apt downloads whatever is missing or changed.
      - name: Name the cache of the browsers' system packages
        id: debs
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "key=playwright-debs-$ImageOS-pw$version-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "same-version=playwright-debs-$ImageOS-pw$version-" >> "$GITHUB_OUTPUT"
          echo "same-os=playwright-debs-$ImageOS-" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers' system packages
        id: debs-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.debs.outputs.key }}
          restore-keys: |
            ${{ steps.debs.outputs.same-version }}
            ${{ steps.debs.outputs.same-os }}
      # 32-87 s on 39 runs of 46; the longest that finished took 14.5 minutes,
      # the mirror at 164 kB/s.
      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          debs=~/.cache/playwright-debs
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo apt-get update -qq
            verified=()
            for deb in "$debs"/*.deb; do
              file=${deb##*/}
              name=${file%%_*}
              version=${file#*_}
              version=${version%_*}
              sum=$(sha256sum "$deb" | cut -d ' ' -f 1)
              if apt-cache show "$name=${version//%3a/:}" 2> /dev/null | grep -qxF "SHA256: $sum"; then
                verified+=("$deb")
              fi
            done
            echo "${#verified[@]} kept system package(s) match the index's SHA-256; apt downloads the rest."
            if [ ${#verified[@]} -gt 0 ]; then sudo cp "${verified[@]}" /var/cache/apt/archives/; fi
          fi
          npx playwright install --with-deps chromium webkit
          rm -rf "$debs" && mkdir -p "$debs"
          cp /var/cache/apt/archives/*.deb "$debs"/ 2> /dev/null || { rm -rf "$debs"; echo 'apt kept no package to cache.'; }
      - name: Save the browsers' system packages
        if: steps.debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.debs.outputs.key }}
      # One start takes 51-82 s. A failed one rolls back what it made (the
      # CLI's own rollback); one could not bind 54322 on a fresh runner (run
      # 41901247867, which does not say what held it) and its re-run passed.
      # So a second attempt follows `stop --no-backup` (whatever the rollback
      # left, volumes included) once no socket holds the stack's two host
      # ports (config.toml's api and db ports; a closed connection keeps its
      # port for 60 s), after printing what held them. Its failure fails the
      # step with the CLI's own message: a stack that cannot start, a broken
      # migration included (the migrations job applies them too), is still
      # red, after two attempts. A run that needed the second carries a
      # warning.
      - name: Start the local Supabase stack
        timeout-minutes: 10
        run: |
          if npx supabase start -x studio,postgres-meta; then exit 0; fi
          echo '::warning title=Local Supabase stack::The first start failed; the stack was stopped and started once more.'
          sudo ss -tanp '( sport = :54321 or sport = :54322 )' || true
          npx supabase stop --no-backup || true
          for i in $(seq 1 60); do
            if [ -z "$(ss -Htan '( sport = :54321 or sport = :54322 )')" ]; then break; fi
            sleep 2
          done
          npx supabase start -x studio,postgres-meta
      # 131-216 s on every run so far (158-236 s on the hosted job). A suite
      # that runs out says so here; the upload below still runs, though a
      # report Playwright had not yet written is not in it (the runner stops
      # this step's shell, not Playwright under it).
      - name: Run Playwright
        timeout-minutes: 15
        run: npm run e2e:web
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Whether the hosted Playwright run CAN run, after a merge to main. This
  # lives in its own job purely so e2e-hosted can gate on it at JOB level: the
  # `secrets` context is not available in a job-level `if`, but a job output
  # is. Gating at job level makes a credential-less run report as "skipped"
  # rather than an unqualified "pass" — the E2E check once went green having
  # executed nothing, which is worse than having no check at all.
  e2e-creds:
    name: E2E credentials present
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - id: probe
        env:
          HAVE: ${{ secrets.E2E_TEST_EMAIL != '' && secrets.E2E_TEST_PASSWORD != '' && secrets.EXPO_PUBLIC_SUPABASE_URL != '' && (secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY != '' || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY != '') }}
        run: |
          echo "present=$HAVE" >> "$GITHUB_OUTPUT"
          if [ "$HAVE" != "true" ]; then
            echo "::warning title=Hosted E2E run skipped::Playwright did not run against the hosted project — set E2E_TEST_EMAIL, E2E_TEST_PASSWORD, EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (or the legacy EXPO_PUBLIC_SUPABASE_ANON_KEY) as repository secrets to enable it."
            echo "### :warning: Hosted Playwright run skipped — E2E secrets not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The same specs against the shared e2e user on the hosted project, after
  # every merge to main and never for a pull request (#221): the one place the
  # suite meets the hosted gateway, keys and services and the schema
  # production actually has, which the local stack cannot stand in for.
  e2e-hosted:
    name: Playwright (hosted)
    # As e2e-web's: its two long steps' limits (35) plus five. It limits the
    # job's run, not its wait in the queue below.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    needs: e2e-creds
    if: github.event_name == 'push' && needs.e2e-creds.outputs.present == 'true'
    permissions:
      contents: read
    # One hosted Playwright job at a time across the repository (#123). Every
    # one signs in as the same shared e2e user, and two running at once
    # collide in two ways:
    #  - A new account takes MAX(sort_order)+1 from its browser's own local
    #    store, so two jobs' fresh accounts can tie. A reorder swaps with the
    #    neighbour in the whole list, foreign accounts included, then renumbers
    #    and pushes every active account. On 2026-09-25 another job's account
    #    tied the reorder spec's C, and "move C up" swapped C with it.
    #  - accounts-reorder.spec.ts deletes every "Reorder Acct " account before
    #    it starts, with no age gate, so it can delete another job's A/B/C.
    # The group spans every ref and workflow in the repository; since #221
    # only main's post-merge runs join it, so each merge's job waits for the
    # one before it. `queue: max` keeps up to 100 jobs pending and starts them
    # in the order they began waiting (FIFO). The default, `queue: single`,
    # keeps one pending job and cancels it when the next one queues.
    # cancel-in-progress stays false here (queue: max rejects true in the same
    # mapping). A job cancelled mid-test leaves the accounts it made, younger
    # than global-setup's 30-minute purge gate, in the shared user until a
    # later run purges them (accounts-reorder.spec.ts purges its own prefix at
    # once).
    concurrency:
      group: playwright-e2e-user
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The same four steps as e2e-web's, under the same key: a red here holds
      # a release (publish-release.yml waits for a green Tests run on main).
      - name: Name the cache of the browsers' system packages
        id: debs
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "key=playwright-debs-$ImageOS-pw$version-$ImageVersion" >> "$GITHUB_OUTPUT"
          echo "same-version=playwright-debs-$ImageOS-pw$version-" >> "$GITHUB_OUTPUT"
          echo "same-os=playwright-debs-$ImageOS-" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers' system packages
        id: debs-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.debs.outputs.key }}
          restore-keys: |
            ${{ steps.debs.outputs.same-version }}
            ${{ steps.debs.outputs.same-os }}
      - name: Install Playwright browsers
        timeout-minutes: 20
        run: |
          debs=~/.cache/playwright-debs
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo apt-get update -qq
            verified=()
            for deb in "$debs"/*.deb; do
              file=${deb##*/}
              name=${file%%_*}
              version=${file#*_}
              version=${version%_*}
              sum=$(sha256sum "$deb" | cut -d ' ' -f 1)
              if apt-cache show "$name=${version//%3a/:}" 2> /dev/null | grep -qxF "SHA256: $sum"; then
                verified+=("$deb")
              fi
            done
            echo "${#verified[@]} kept system package(s) match the index's SHA-256; apt downloads the rest."
            if [ ${#verified[@]} -gt 0 ]; then sudo cp "${verified[@]}" /var/cache/apt/archives/; fi
          fi
          npx playwright install --with-deps chromium webkit
          rm -rf "$debs" && mkdir -p "$debs"
          cp /var/cache/apt/archives/*.deb "$debs"/ 2> /dev/null || { rm -rf "$debs"; echo 'apt kept no package to cache.'; }
      - name: Save the browsers' system packages
        if: steps.debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.debs.outputs.key }}
      - name: Run Playwright
        timeout-minutes: 15
        env:
          E2E_TARGET: hosted
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          # The app on the dev server and global-setup's purge client both take
          # the publishable key when it is set, else the anon key (#191).
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          # global-setup tombstones test-prefixed accounts older than 30 minutes
          # in the shared test user before signing in, so a failed attempt's
          # leftovers cannot pile up until account creation times out (#54).
          # Age-gated because two of these jobs could run at once before the
          # concurrency group above (#123); the gate stays for a hosted run on
          # a developer's machine beside this job, and as belt and braces.
          E2E_PURGE_STALE_TEST_ACCOUNTS: '1'
        run: npm run e2e:web
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hosted
          path: playwright-report/
          retention-days: 7
