name: TestFlight

# Manual only, on purpose. An iOS build that includes a schema change has to
# follow the database migration (migrate.yml), and nothing in GitHub Actions can
# enforce that order against Netlify's independent web deploy — so the order is
# a person pressing two buttons, migration first.
#
# Nothing here needs a Mac. The build runs on Expo's macOS fleet, the signing
# credentials are created by EAS from the App Store Connect API key, and the
# upload to TestFlight is an API call. Secrets this workflow expects:
#
#   EXPO_TOKEN       Expo access token (expo.dev → account → Access tokens).
#   ASC_API_KEY_P8   Contents of the App Store Connect API key .p8 file.
#   ASC_KEY_ID       Its Key ID.
#   ASC_ISSUER_ID    The Issuer ID shown on the same App Store Connect page.
#
# The API key must have the Admin role: EAS uses it to create or repair the
# distribution certificate and provisioning profile, not only to upload, and
# App Manager cannot create certificates. Only the Account Holder or an Admin
# can mint that key.
#
# Build-time configuration (EXPO_PUBLIC_SUPABASE_URL and _ANON_KEY) is NOT
# passed from here. `.env.local` is gitignored and never reaches Expo's build
# machines, so those two values must be set as EAS environment variables for the
# `production` environment on expo.dev — which the build profile selects via
# "environment": "production" in eas.json. A build without them installs and
# then fails at first launch with "supabaseUrl is required".
on:
  workflow_dispatch:

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    # The free EAS tier queues at low priority, so the wait is mostly Expo's
    # queue, not the build. Waiting here (rather than --no-wait) keeps the
    # submission in the same log, so a phone can follow it end to end.
    timeout-minutes: 120
    # `runner.temp` is not available to a job-level env block, only inside a
    # step, so the key's path is exported by the step that writes the file.
    env:
      # Under API-key authentication eas-cli must be TOLD the Apple team type;
      # otherwise it asks, and that question is a select whose first entry is
      # "Enterprise" — which the Enter-pressing loop below would choose,
      # producing in-house signing. INDIVIDUAL and COMPANY_OR_ORGANIZATION both
      # yield ordinary App Store signing, so if the Apple Developer Program
      # enrollment is an organization, change this to COMPANY_OR_ORGANIZATION;
      # the build is unaffected either way, only the label is wrong.
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The project has no expo-dev-client; the warning is noise for a store build.
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the rest of the repo's CI uses: eas-cli 24 depends on
          # @oclif/plugin-autocomplete, whose engines field demands Node >= 22,
          # and the Expo action installs it with yarn, which enforces that. The
          # app itself is fine on 22 — the full local gate was run on it.
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::ASC_API_KEY_P8 is not set; see the header of this workflow."
            exit 1
          fi
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc-api-key.p8" >> "$GITHUB_ENV"
          # The team ID is the other value API-key auth cannot discover on its
          # own. Left unset it becomes a free-text question that rejects an empty
          # answer, which the Enter loop in the next step would feed it forever.
          # app.json already holds it (ios.appleTeamId); read it from there.
          echo "EXPO_APPLE_TEAM_ID=$(node -p "require('./app.json').expo.ios.appleTeamId")" >> "$GITHUB_ENV"

      # Apple rejected the key once with a bare 401, and eas-cli's response to
      # that is to fall back to an Apple-ID login prompt — which on a runner
      # turns into a five-minute loop and an unreadable log. So prove the key
      # to Apple first, in isolation, with a precise verdict. This signs the
      # same kind of token eas-cli signs (ES256, iss = Issuer ID, kid = Key ID)
      # and asks the API for one app. Any failure stops the job here.
      - name: Check the App Store Connect key against Apple
        run: |
          node - <<'JS'
          (async () => {
          const crypto = require('crypto');
          const fs = require('fs');
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
          const keyId = process.env.EXPO_ASC_KEY_ID || '';
          const issuer = process.env.EXPO_ASC_ISSUER_ID || '';
          if (!/^[A-Z0-9]{10}$/.test(keyId)) {
            fail(`ASC_KEY_ID should be the 10-character Key ID from the key's row (got ${keyId.length} characters).`);
          }
          if (!/^[0-9a-f-]{36}$/i.test(issuer)) {
            fail(`ASC_ISSUER_ID should be the UUID shown at the top of the Team Keys page (got ${issuer.length} characters).`);
          }
          let key;
          try {
            key = crypto.createPrivateKey(fs.readFileSync(process.env.EXPO_ASC_API_KEY_PATH, 'utf8'));
          } catch (e) {
            fail(`ASC_API_KEY_P8 is not a readable private key (${e.message}). Paste the entire .p8 file, BEGIN and END lines included, with its line breaks.`);
          }
          if (key.asymmetricKeyType !== 'ec') {
            fail(`ASC_API_KEY_P8 is a ${key.asymmetricKeyType} key; an App Store Connect key is an EC (P-256) key.`);
          }
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const head = b64({ alg: 'ES256', kid: keyId, typ: 'JWT' });
          const call = async (claims) => {
            const body = b64({ ...claims, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' });
            const sig = crypto
              .sign('sha256', Buffer.from(`${head}.${body}`), { key, dsaEncoding: 'ieee-p1363' })
              .toString('base64url');
            const res = await fetch('https://api.appstoreconnect.apple.com/v1/apps?limit=1', {
              headers: { Authorization: `Bearer ${head}.${body}.${sig}` },
            });
            return { status: res.status, ok: res.ok, text: await res.text() };
          };
          // A Team key signs { iss: <Issuer ID> }; an Individual key signs
          // { sub: 'user' } and no issuer. eas-cli only ever signs the Team
          // shape, so trying both tells us WHICH mistake was made.
          const team = await call({ iss: issuer });
          if (team.ok) {
            console.log('App Store Connect accepted the key.');
            process.exit(0);
          }
          let detail = team.text;
          try { detail = JSON.parse(team.text).errors.map((e) => `${e.title}: ${e.detail}`).join(' | '); } catch {}
          if (team.status === 403) {
            fail(`App Store Connect rejected the key: HTTP 403. ${detail} The key is valid but lacks permission: it needs the Admin role.`);
          }
          if (team.status !== 401) {
            fail(`App Store Connect rejected the key: HTTP ${team.status}. ${detail}`);
          }
          const individual = await call({ sub: 'user' });
          if (individual.ok) {
            fail('This is an INDIVIDUAL App Store Connect key: Apple accepts it only with the individual token shape, which the Expo tooling never signs. Generate a key under the Team Keys tab (Users and Access > Integrations > App Store Connect API > Team Keys) with the Admin role, then replace ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID with that key\'s values.');
          }
          fail(`App Store Connect rejected the key with both token shapes (HTTP 401): ${detail} The Key ID does not belong to this .p8, or the Issuer ID is not the one from the Team Keys page. Re-copy the Key ID from the row of the key whose .p8 was downloaded, and the Issuer ID from the top of the Team Keys tab.`);
          })().catch((e) => { console.log(`::error::Key check crashed: ${e.message}`); process.exit(1); });
          JS

      # The one thing `eas build --non-interactive` will not do is create the
      # FIRST distribution certificate: with none stored on EAS it stops with
      # "Credentials are not set up. Run this command again in interactive
      # mode" (SetUpDistributionCertificate's non-interactive branch is a TODO).
      # This step is that interactive run, scoped to credentials only, before
      # anything is queued. It authenticates to Apple with the API key and
      # creates the certificate and the App Store provisioning profile.
      #
      # Interactive means questions, and the runner has no terminal — eas-cli
      # throws "stdin is not readable" the moment it tries to ask one. So the
      # command gets a pseudo-terminal from `script`, and a loop presses Enter
      # once a second for as long as it runs. That is safe because, with the
      # team ID and team type supplied through the environment (see above),
      # every remaining question on this path is a yes/no whose default is the
      # answer we want:
      # "Generate a new Apple Distribution Certificate?" and "Generate a new
      # Provisioning Profile?" both default to yes on a first run, and on a
      # later repair "Reuse this distribution certificate?" and "Would you like
      # to reuse the original profile?" also default to yes (confirmAsync in
      # eas-cli 24.1.2 sets initial: true throughout). With valid credentials
      # already stored the step verifies them against Apple and returns early
      # without asking anything. A non-zero exit here is a real failure (bad
      # key, wrong role, wrong owner) and stops the job at the step where the
      # cause is, rather than one step later.
      - name: Set up signing credentials (creates them on the first run)
        # Creating a certificate and profile takes well under a minute. Anything
        # longer means a question nobody can answer; cut it off rather than let
        # it run out the job's two-hour budget as it once did.
        timeout-minutes: 10
        run: |
          # Throttled rather than `yes`: one Enter per second answers each
          # question as it appears without flooding the terminal.
          # The subcommand is addressed with a colon: with a space, eas-cli runs
          # the plain `credentials` command and rejects --profile as unknown.
          (while :; do echo; sleep 1; done) 2>/dev/null \
            | script -q -e -c "eas credentials:configure-build --platform ios --profile production" /dev/null \
            2>&1 | tee "$RUNNER_TEMP/credentials.log"
          exit "${PIPESTATUS[1]}"

      - name: Build and submit
        # --auto-submit uses the submit profile of the same name once the build
        # finishes. The build number is assigned by EAS (appVersionSource:
        # remote + autoIncrement), so TestFlight never sees a duplicate.
        run: >-
          eas build --platform ios --profile production
          --non-interactive --auto-submit
