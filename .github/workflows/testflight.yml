name: TestFlight

# Manual only, on purpose. An iOS build that includes a schema change has to
# follow the database migration (migrate.yml), and nothing in GitHub Actions can
# enforce that order against Netlify's independent web deploy — so the order is
# a person pressing two buttons, migration first.
#
# Nothing here needs a Mac. The build runs on Expo's macOS fleet, the signing
# credentials are created by EAS from the App Store Connect API key, and the
# upload to TestFlight is an API call. Secrets this workflow expects:
#
#   EXPO_TOKEN       Expo access token (expo.dev → account → Access tokens).
#   ASC_API_KEY_P8   Contents of the App Store Connect API key .p8 file.
#   ASC_KEY_ID       Its Key ID.
#   ASC_ISSUER_ID    The Issuer ID shown on the same App Store Connect page.
#
# The API key must have the Admin role: EAS uses it to create or repair the
# distribution certificate and provisioning profile, not only to upload, and
# App Manager cannot create certificates. Only the Account Holder or an Admin
# can mint that key.
#
# Build-time configuration (EXPO_PUBLIC_SUPABASE_URL and _ANON_KEY) is NOT
# passed from here. `.env.local` is gitignored and never reaches Expo's build
# machines, so those two values must be set as EAS environment variables for the
# `production` environment on expo.dev — which the build profile selects via
# "environment": "production" in eas.json. A build without them installs and
# then fails at first launch with "supabaseUrl is required".
on:
  workflow_dispatch:

jobs:
  build-and-submit:
    name: Build iOS and submit to TestFlight
    runs-on: ubuntu-latest
    # The free EAS tier queues at low priority, so the wait is mostly Expo's
    # queue, not the build. Waiting here (rather than --no-wait) keeps the
    # submission in the same log, so a phone can follow it end to end.
    timeout-minutes: 120
    env:
      EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc-api-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # The project has no expo-dev-client; the warning is noise for a store build.
      EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the rest of the repo's CI uses: eas-cli 24 depends on
          # @oclif/plugin-autocomplete, whose engines field demands Node >= 22,
          # and the Expo action installs it with yarn, which enforces that. The
          # app itself is fine on 22 — the full local gate was run on it.
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::ASC_API_KEY_P8 is not set; see the header of this workflow."
            exit 1
          fi
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/asc-api-key.p8"

      # The one thing `eas build --non-interactive` will not do is create the
      # FIRST distribution certificate: with none stored on EAS it stops with
      # "Credentials are not set up. Run this command again in interactive
      # mode" (SetUpDistributionCertificate's non-interactive branch is a TODO).
      # This step is that interactive run, scoped to credentials only, before
      # anything is queued. It authenticates to Apple with the API key and
      # creates the certificate and the App Store provisioning profile.
      #
      # Interactive means questions, and the runner has no terminal — eas-cli
      # throws "stdin is not readable" the moment it tries to ask one. So the
      # command gets a pseudo-terminal from `script`, and a loop presses Enter
      # once a second for as long as it runs. That is safe because every
      # question on this path is a yes/no whose default is the answer we want:
      # "Generate a new Apple Distribution Certificate?" and "Generate a new
      # Provisioning Profile?" both default to yes on a first run, and on a
      # later repair "Reuse this distribution certificate?" and "Would you like
      # to reuse the original profile?" also default to yes (confirmAsync in
      # eas-cli 24.1.2 sets initial: true throughout). With valid credentials
      # already stored the step verifies them against Apple and returns early
      # without asking anything. A non-zero exit here is a real failure (bad
      # key, wrong role, wrong owner) and stops the job at the step where the
      # cause is, rather than one step later.
      - name: Set up signing credentials (creates them on the first run)
        run: |
          # Throttled rather than `yes`: one Enter per second answers each
          # question as it appears without flooding the terminal.
          (while :; do echo; sleep 1; done) \
            | script -q -e -c "eas credentials configure-build --platform ios --profile production" /dev/null \
            2>&1 | tee "$RUNNER_TEMP/credentials.log"
          exit "${PIPESTATUS[1]}"

      - name: Build and submit
        # --auto-submit uses the submit profile of the same name once the build
        # finishes. The build number is assigned by EAS (appVersionSource:
        # remote + autoIncrement), so TestFlight never sees a duplicate.
        run: >-
          eas build --platform ios --profile production
          --non-interactive --auto-submit
